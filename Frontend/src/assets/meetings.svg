<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Departure-board style timetable listing upcoming meetings in orange and past meetings in green">
  <!-- board -->
  <rect x="0" y="0" width="480" height="400" fill="#16130F"/>
  <rect x="24" y="24" width="432" height="44" fill="#221E19"/>
  <g fill="#F3EFE6" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" letter-spacing="2">
    <text x="40" y="52">TIME</text>
    <text x="132" y="52">MEETING</text>
    <text x="352" y="52">STATUS</text>
  </g>

  <!-- rows -->
  <g font-family="JetBrains Mono, monospace" font-weight="700">
    <g transform="translate(0 92)">
      <text x="40" y="26" fill="#F3EFE6" font-size="26">09:00</text>
      <rect x="132" y="8" width="150" height="10" fill="#6B645A"/>
      <rect x="132" y="24" width="96" height="6" fill="#3A342C"/>
      <rect x="352" y="6" width="88" height="24" fill="#2F7D4F"/>
      <text x="363" y="23" fill="#F3EFE6" font-size="12" letter-spacing="1.5">DONE</text>
    </g>
    <g transform="translate(0 152)">
      <text x="40" y="26" fill="#F3EFE6" font-size="26">10:30</text>
      <rect x="132" y="8" width="182" height="10" fill="#6B645A"/>
      <rect x="132" y="24" width="72" height="6" fill="#3A342C"/>
      <rect x="352" y="6" width="88" height="24" fill="#2F7D4F"/>
      <text x="363" y="23" fill="#F3EFE6" font-size="12" letter-spacing="1.5">DONE</text>
    </g>
    <g transform="translate(0 212)">
      <text x="40" y="26" fill="#F3EFE6" font-size="26">13:00</text>
      <rect x="132" y="8" width="128" height="10" fill="#C9C0AF"/>
      <rect x="132" y="24" width="110" height="6" fill="#3A342C"/>
      <rect x="352" y="6" width="88" height="24" fill="#D9481F"/>
      <text x="363" y="23" fill="#16130F" font-size="12" letter-spacing="1.5">NEXT</text>
    </g>
    <g transform="translate(0 272)">
      <text x="40" y="26" fill="#F3EFE6" font-size="26">15:45</text>
      <rect x="132" y="8" width="164" height="10" fill="#C9C0AF"/>
      <rect x="132" y="24" width="84" height="6" fill="#3A342C"/>
      <rect x="352" y="6" width="88" height="24" fill="#D9481F"/>
      <text x="363" y="23" fill="#16130F" font-size="12" letter-spacing="1.5">NEXT</text>
    </g>
  </g>

  <!-- duration ribbons -->
  <rect x="40" y="344" width="120" height="8" fill="#2F7D4F"/>
  <rect x="164" y="344" width="64" height="8" fill="#2F7D4F"/>
  <rect x="232" y="344" width="156" height="8" fill="#D9481F"/>
  <rect x="392" y="344" width="48" height="8" fill="#D9481F"/>
</svg>
